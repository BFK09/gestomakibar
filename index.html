<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icone.svg" />
    <link rel="apple-touch-icon" href="./icone-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f0f07" />
    <!-- Écran de démarrage : affiché tout de suite (avant que l'application soit chargée),
         aux couleurs du logo, pour éviter le flash blanc d'une page web qui charge. -->
    <style>
      html { background: #1f0f07; }
      .demarrage { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, #3a1d0f, #1f0f07 70%); }
      .demarrage img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 12px 40px rgba(0, 0, 0, .45); animation: demarrage-pulse 1.4s ease-in-out infinite; }
      @keyframes demarrage-pulse { 50% { transform: scale(.96); opacity: .85; } }
    </style>
    <title>GESTOMAKIBAR</title>
  </head>
  <body>
    <div id="root"><div class="demarrage"><img src="./icone.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
