<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icone.svg" />
    <link rel="apple-touch-icon" href="./icone-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f0f07" />
    <!-- Écran de démarrage : affiché tout de suite (avant que l'application soit chargée),
         aux couleurs du logo, pour éviter le flash blanc d'une page web qui charge. -->
    <style>
      html { background: #1f0f07; }
      /* Même fond, même taille et même place que l'écran de démarrage Android (APK) : le relais ne se voit pas. */
      .demarrage { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #1f0f07; }
      .demarrage img { width: min(40vw, 40vh); height: min(40vw, 40vh); animation: demarrage-pulse 1.4s ease-in-out 1.2s infinite; }
      @keyframes demarrage-pulse { 50% { opacity: .8; } }
    </style>
    <title>GESTOMAKIBAR</title>
  </head>
  <body>
    <div id="root"><div class="demarrage"><img src="./icone.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
